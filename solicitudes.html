<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QCV · Solicitudes</title>
<meta property="og:type" content="website" />
<meta property="og:title" content="CV Vault · Solicitudes · QCV" />
<meta property="og:description" content="Revisa los formularios que llenaron tus clientes, listos para copiar a tu prompt de generación de CV." />
<meta property="og:image" content="https://cv-vault.netlify.app/assets/og-image.png" />
<meta property="og:url" content="https://cv-vault.netlify.app/solicitudes.html" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="CV Vault · Solicitudes · QCV" />
<meta name="twitter:description" content="Revisa los formularios que llenaron tus clientes, listos para copiar a tu prompt de generación de CV." />
<meta name="twitter:image" content="https://cv-vault.netlify.app/assets/og-image.png" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A1229; --bg2:#0F1B3D; --surface:#101B3B; --card:#121F45;
    --line:rgba(255,255,255,.09); --ink:#F4F7FC; --ink-soft:#93A0C2;
    --grad:linear-gradient(120deg,#1650C9 0%,#22C7F5 100%);
    --cyan:#22C7F5; --gold:#F5B942; --ok:#33C481; --err:#F16565;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px;}
  .brandrow{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
  .brandrow img{height:28px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em;}
  .sub{color:var(--ink-soft);font-size:14px;margin-bottom:32px;}
  input[type=password],input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;background:var(--bg2);color:var(--ink);margin-bottom:12px;}
  input:focus{outline:2px solid var(--cyan);outline-offset:1px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:8px;cursor:pointer;transition:all .15s ease;}
  .btn-primary{width:100%;background:var(--grad);color:#fff;padding:14px;font-size:15px;box-shadow:0 10px 26px rgba(34,199,245,.2);}
  .btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 12px 32px rgba(34,199,245,.35);}
  .gate{max-width:340px;margin:100px auto;text-align:center;}
  .gate img{height:40px;margin-bottom:20px;}
  .gate .pill-toggle{margin:0 auto 24px;width:fit-content;}
  .gate .portal-tabs{margin:0 auto 24px;width:fit-content;}
  .status{font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-top:10px;min-height:16px;color:var(--err);}

  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:44px;}
  .eye-btn{
    position:absolute;right:4px;top:4px;bottom:16px;width:36px;background:none;border:none;
    color:var(--ink-soft);display:flex;align-items:center;justify-content:center;padding:0;
  }
  .eye-btn:hover{color:var(--cyan);}
  .eye-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
  a.brandrow{text-decoration:none;}
  .portal-tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px;flex-wrap:wrap;}
  .portal-tabs .tab{
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:var(--ink-soft);
    padding:7px 14px;border-radius:16px;text-decoration:none;transition:all .15s ease;white-space:nowrap;
  }
  .portal-tabs .tab:hover{color:var(--ink);}
  .portal-tabs .tab.active{background:var(--grad);color:#fff;}
  @media (max-width:600px){
    .topbar{flex-direction:column;align-items:flex-start;}
    .portal-tabs{width:100%;justify-content:space-between;}
    .topctrls{width:100%;justify-content:space-between;}
  }
  .pill-toggle{display:flex;border:1px solid var(--line);border-radius:20px;padding:3px;background:var(--surface);}
  .pill-toggle button{border:none;background:none;color:var(--ink-soft);font-size:12px;font-weight:600;padding:5px 11px;border-radius:16px;cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:color .15s ease;}
  .pill-toggle button.active{background:var(--grad);color:#fff;}
  .pill-toggle button:hover:not(.active){color:var(--ink);}
  .topctrls{display:flex;align-items:center;gap:10px;}
  .btn-logout{background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);padding:8px 14px;font-size:12.5px;}
  .btn-logout:hover{color:var(--err);border-color:var(--err);}

  .req-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px;}
  .req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .req-name{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;}
  .req-date{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .req-row{font-size:13.5px;color:var(--ink-soft);margin-bottom:4px;}
  .req-row b{color:var(--ink);font-weight:600;}
  .req-exp{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .req-exp-item{font-size:13px;color:var(--ink-soft);margin-bottom:3px;}
  .req-actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;}
  .btn-copy{background:var(--surface);border:1px solid var(--cyan);color:var(--cyan);padding:10px 16px;font-size:13px;}
  .btn-copy:hover{background:var(--bg2);transform:translateY(-1px);}
  .btn-copy.copied{background:var(--ok);border-color:var(--ok);color:#fff;}
  .empty{text-align:center;padding:60px 20px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
</style>
</head>
<body>

<div id="gate" class="wrap gate">
  <img src="assets/logo.png" alt="QCV" />
  <div class="portal-tabs">
    <a href="https://qcv-landing.netlify.app/" class="tab" data-i18n="tab_landing">Landing</a>
    <a href="admin.html" class="tab" data-i18n="tab_panel">Panel</a>
    <a href="solicitudes.html" class="tab active" data-i18n="tab_requests">Solicitudes</a>
    <a href="historial.html" class="tab" data-i18n="tab_history">Historial</a>
    <a href="https://qcv-landing.netlify.app/formulario.html" class="tab" data-i18n="tab_form">Formulario</a>
  </div>
  <div class="pill-toggle" id="langToggleGate">
    <button data-lang="es">ES</button>
    <button data-lang="en">EN</button>
  </div>
  <div class="eyebrow" data-i18n="gate_eyebrow">Acceso privado</div>
  <h1 style="font-size:22px;" data-i18n="gate_title">Código de acceso</h1>
  <div class="pw-wrap">
    <input type="password" id="gateCode" data-i18n-ph="gate_ph" placeholder="••••••" />
    <button type="button" class="eye-btn" id="eyeBtn" onclick="toggleEye()" aria-label="Mostrar/ocultar">
      <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.6 18.6 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a18.6 18.6 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
  </div>
  <button class="btn-primary" onclick="loadRequests()" data-i18n="gate_enter">Entrar</button>
  <div class="status" id="gateStatus"></div>
</div>

<div class="wrap" id="app" style="display:none;">
  <div class="topbar">
    <a href="admin.html" class="brandrow" style="margin-bottom:0;"><img src="assets/logo.png" alt="QCV" /></a>
    <div class="portal-tabs">
      <a href="https://qcv-landing.netlify.app/" class="tab" data-i18n="tab_landing">Landing</a>
      <a href="admin.html" class="tab" data-i18n="tab_panel">Panel</a>
      <a href="solicitudes.html" class="tab active" data-i18n="tab_requests">Solicitudes</a>
      <a href="historial.html" class="tab" data-i18n="tab_history">Historial</a>
      <a href="https://qcv-landing.netlify.app/formulario.html" class="tab" data-i18n="tab_form">Formulario</a>
    </div>
    <div class="topctrls">
      <div class="pill-toggle" id="langToggleApp">
        <button data-lang="es">ES</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="btn-logout" onclick="logout()" data-i18n="logout">Cerrar sesión</button>
    </div>
  </div>
  <div class="eyebrow" data-i18n="eyebrow">CV Vault · Solicitudes</div>
  <h1 data-i18n="title">Formularios recibidos</h1>
  <div class="sub" data-i18n="subtitle">Cada tarjeta es un cliente que llenó el formulario. Usa "Copiar todo" para pegarlo directo en tu prompt de generación de CV.</div>
  <div id="list"></div>
</div>

<script>
// ============================================================
// CONFIGURA ESTE VALOR ANTES DE DESPLEGAR
// ============================================================
const EDGE_FUNCTION_URL = "https://rwugrzexjmvcxgzznqjj.functions.supabase.co/list-requests";
// ============================================================

// ---------- i18n ----------
const dict = {
  es: {
    logout:"Cerrar sesión", eyebrow:"CV Vault · Solicitudes", title:"Formularios recibidos",
    subtitle:'Cada tarjeta es un cliente que llenó el formulario. Usa "Copiar todo" para pegarlo directo en tu prompt de generación de CV.',
    gate_eyebrow:"Acceso privado", gate_title:"Código de acceso",
    gate_ph:"••••••", gate_enter:"Entrar",
    tab_landing:"Landing", tab_panel:"Panel", tab_requests:"Solicitudes", tab_history:"Historial", tab_form:"Formulario",
    err_wrong:"Código incorrecto", err_load:"Error al cargar", err_conn:"Error de conexión",
    loading:"Cargando...", empty:"Aún no hay solicitudes.",
    lbl_email:"Email:", lbl_phone:"Teléfono:", lbl_edu:"Educación:", lbl_cert:"Certificaciones:",
    lbl_exp:"Experiencia laboral:", no_exp:"(ninguna indicada)", no_name:"(sin nombre)",
    btn_copy:"📋 Copiar todo", btn_copied:"✓ Copiado",
  },
  en: {
    logout:"Log out", eyebrow:"CV Vault · Requests", title:"Submitted forms",
    subtitle:'Each card is a client who filled out the form. Use "Copy all" to paste it directly into your resume-generation prompt.',
    gate_eyebrow:"Private access", gate_title:"Access code",
    gate_ph:"••••••", gate_enter:"Enter",
    tab_landing:"Landing", tab_panel:"Panel", tab_requests:"Requests", tab_history:"History", tab_form:"Form",
    err_wrong:"Incorrect code", err_load:"Error loading data", err_conn:"Connection error",
    loading:"Loading...", empty:"No requests yet.",
    lbl_email:"Email:", lbl_phone:"Phone:", lbl_edu:"Education:", lbl_cert:"Certifications:",
    lbl_exp:"Work experience:", no_exp:"(none provided)", no_name:"(unnamed)",
    btn_copy:"📋 Copy all", btn_copied:"✓ Copied",
  }
};

let currentLang = localStorage.getItem('qcv_admin_lang') || 'es';

function applyLang(lang){
  currentLang = lang;
  localStorage.setItem('qcv_admin_lang', lang);
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(dict[lang][key] !== undefined) el.textContent = dict[lang][key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const key = el.getAttribute('data-i18n-ph');
    if(dict[lang][key] !== undefined) el.placeholder = dict[lang][key];
  });
  document.querySelectorAll('.pill-toggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  if(window._requests) renderList(window._requests);
}
document.querySelectorAll('.pill-toggle button').forEach(b=>{
  b.addEventListener('click', ()=> applyLang(b.dataset.lang));
});
applyLang(currentLang);

function toggleEye(){
  const input = document.getElementById('gateCode');
  const icon = document.getElementById('eyeIcon');
  const willShow = input.type === 'password';
  input.type = willShow ? 'text' : 'password';
  icon.innerHTML = willShow
    ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.6 18.6 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a18.6 18.6 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
}

let sessionCode = null;

function logout(){
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='block';
  document.getElementById('gateCode').value='';
  document.getElementById('gateStatus').textContent='';
  window._requests = null;
  sessionCode = null;
  localStorage.removeItem('qcv_cvvault_code');
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-DO', {day:'2-digit', month:'short', year:'numeric'}) +
         ' · ' + d.toLocaleTimeString('es-DO', {hour:'2-digit', minute:'2-digit'});
}

function buildCopyText(r){
  const exp = (r.experience || []).map(e =>
    `- ${e.place || '(sin nombre)'}${e.position ? ' — ' + e.position : ''} (${e.start_year || '?'} – ${e.end_year || '?'})`
  ).join('\n');

  return `Nombre completo: ${r.full_name}
Email: ${r.email}
Teléfono: ${r.phone}

Experiencia laboral:
${exp || '(ninguna indicada)'}

Educación: ${r.education || 'N/A'}
Certificaciones: ${r.certifications || 'N/A'}`;
}

async function loadRequests(codeOverride){
  const code = codeOverride || document.getElementById('gateCode').value;
  const status = document.getElementById('gateStatus');
  status.textContent = dict[currentLang].loading;

  try{
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({code})
    });
    const json = await res.json();

    if(!res.ok){
      status.textContent = json.error === 'unauthorized' ? dict[currentLang].err_wrong : dict[currentLang].err_load;
      localStorage.removeItem('qcv_cvvault_code');
      return;
    }

    localStorage.setItem('qcv_cvvault_code', code);
    sessionCode = code;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    window._requests = json.data || [];
    renderList(window._requests);
  }catch(err){
    status.textContent = dict[currentLang].err_conn;
    console.error(err);
  }
}

// Si ya iniciaste sesión antes en cualquiera de los portales de CV Vault,
// no vuelve a pedir el código al recargar — solo el botón "Cerrar sesión" sale.
const _savedCode = localStorage.getItem('qcv_cvvault_code');
if(_savedCode) loadRequests(_savedCode);

function renderList(data){
  const l = dict[currentLang];
  const list = document.getElementById('list');
  if(!data || data.length === 0){
    list.innerHTML = `<div class="empty">${l.empty}</div>`;
    return;
  }

  list.innerHTML = data.map((r, i) => `
    <div class="req-card">
      <div class="req-top">
        <div class="req-name">${escapeHtml(r.full_name)}</div>
        <div class="req-date">${fmtDate(r.created_at)}</div>
      </div>
      <div class="req-row"><b>${l.lbl_email}</b> ${escapeHtml(r.email)}</div>
      <div class="req-row"><b>${l.lbl_phone}</b> ${escapeHtml(r.phone)}</div>
      <div class="req-row"><b>${l.lbl_edu}</b> ${escapeHtml(r.education || 'N/A')}</div>
      <div class="req-row"><b>${l.lbl_cert}</b> ${escapeHtml(r.certifications || 'N/A')}</div>
      <div class="req-exp">
        <div class="req-row"><b>${l.lbl_exp}</b></div>
        ${(r.experience || []).map(e => `<div class="req-exp-item">• ${escapeHtml(e.place||l.no_name)}${e.position ? ' — ' + escapeHtml(e.position) : ''} (${escapeHtml(e.start_year||'?')} – ${escapeHtml(e.end_year||'?')})</div>`).join('') || `<div class="req-exp-item">${l.no_exp}</div>`}
      </div>
      <div class="req-actions">
        <button class="btn-copy" id="copyBtn${i}" onclick="copyRequest(${i}, this)">${l.btn_copy}</button>
      </div>
    </div>
  `).join('');
}

function copyRequest(i, btn){
  const text = buildCopyText(window._requests[i]);
  navigator.clipboard.writeText(text);
  const original = btn.textContent;
  btn.textContent = dict[currentLang].btn_copied;
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent = original; btn.classList.remove('copied'); }, 1800);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

document.getElementById('gateCode').addEventListener('keydown', e => {
  if(e.key === 'Enter') loadRequests();
});
</script>
</body>
</html>
